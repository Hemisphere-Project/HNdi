# HNdi — /boot/hndi.conf  (INI; read by hndi-in at start)
# Runtime overrides (source picked from the control room) live on /data, not here.

[input]
source =              # exact NDI name, e.g. "REGIE (Resolume Arena - Output)"; blank = first found
                      # also accepted: ndi://ip:port or ip:port (direct, no discovery)
width = 1920          # /dev/video caps — stable for Chrome. Prefer the LED-native size.
height = 1080
fps =                 # blank = passthrough; e.g. 60 inserts videorate
format = YUY2         # what Chrome accepts from V4L2 (bench 2026-09-04: UYVY is NOT listed by Chrome)
device = 10           # /dev/video10, card_label=NDI
bandwidth = highest   # highest | lowest (NDI proxy stream) | auto
# jitter / dropout recovery (a brief gap is ridden out; only a real dead link reconnects)
hold_ms = 1500        # show the last frame this long on a gap, then black
stall_ms = 800        # no frame this long → 'stalled' (held, receiver kept — not a restart)
dead_ms = 8000        # no frame this long → reconnect (tear down + re-resolve)
profile = lowlatency  # lowlatency (Ethernet, tight) | robust (WiFi: ~100ms jitter buffer)
receiver_name =       # advertised NDI receiver name; blank = "<hostname> (HNdi)"
nosignal = black      # black | slate ('NO NDI SIGNAL' card with hostname + source)
api_port = 8791

[discovery]
server =              # NDI Discovery Server IP when mDNS does not cross a bridge
